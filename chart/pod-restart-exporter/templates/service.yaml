apiVersion: v1
kind: Service
metadata:
  name: {{ include "pre.name" . }}
  labels: {{- include "pre.labels" . | nindent 4 }}
  {{- if .Values.prometheusScrapeAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  selector: {{- include "pre.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.port }}
      targetPort: metrics
