# Read-only: the exporter can list pods and nothing else.
{{- $kind := ternary "ClusterRole" "Role" (empty .Values.watchNamespace) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "pre.name" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels: {{- include "pre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}Binding
metadata:
  name: {{ include "pre.name" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels: {{- include "pre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "pre.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pre.name" . }}
    namespace: {{ .Release.Namespace }}
