apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pre.name" . }}
  labels: {{- include "pre.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "pre.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pre.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pre.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.port }}
            {{- if .Values.watchNamespace }}
            - -namespace={{ .Values.watchNamespace }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
