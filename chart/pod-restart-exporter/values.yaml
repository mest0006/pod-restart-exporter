image:
  repository: ghcr.io/mest0006/pod-restart-exporter
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Leave empty to watch all namespaces (uses a ClusterRole).
# Set a namespace to watch only that one (uses a namespaced Role).
watchNamespace: ""

port: 9101

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Adds prometheus.io/scrape annotations for annotation-based discovery.
prometheusScrapeAnnotations: true
